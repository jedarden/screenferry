<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>screenferry spike — Phase 0.5 measurement rig</title>
<style>
  :root { color-scheme: dark }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:#111; color:#eee }
  header { padding:.6rem 1rem; background:#1c1c1c; display:flex; gap:1rem; align-items:center; flex-wrap:wrap }
  button { font:inherit; padding:.4rem .9rem; border:1px solid #555; background:#2a2a2a; color:#eee; border-radius:4px; cursor:pointer }
  button[aria-pressed=true] { background:#2d5; color:#000; border-color:#2d5 }
  label { display:flex; gap:.35rem; align-items:center }
  select,input { font:inherit; background:#222; color:#eee; border:1px solid #444; border-radius:3px; padding:.2rem }
  main { display:none; padding:1rem }
  main.on { display:block }
  #tx { background:#d8d8d8; display:block; width:100%; height:auto }
  #cam { width:100%; max-width:640px; background:#000 }
  table { border-collapse:collapse; margin-top:.8rem; font-variant-numeric:tabular-nums }
  td { padding:.2rem .8rem .2rem 0 }
  td:first-child { color:#999 }
  .big { font-size:1.6rem; font-weight:600 }
  .warn { color:#fb4 } .bad { color:#f66 } .ok { color:#5d5 }
  code { background:#222; padding:.1rem .3rem; border-radius:3px }
</style>

<header>
  <strong>screenferry spike</strong>
  <button id="bSend" aria-pressed="false">Sender</button>
  <button id="bRecv" aria-pressed="false">Receiver</button>
  <label>rung
    <select id="rung">
      <option value="R1">R1 v10 · 1 pkt · conservative</option>
      <option value="R2" selected>R2 v16 · 2 pkt · nominal</option>
      <option value="R3">R3 v20 · 3 pkt · aggressive</option>
      <option value="R4">R4 v23 · 4 pkt · probe</option>
    </select>
  </label>
  <label>module px <input id="mod" type="number" value="4" min="2" max="12" style="width:3.5rem"></label>
  <label>grid <input id="cols" type="number" value="4" min="1" max="8" style="width:3rem">×<input id="rows" type="number" value="3" min="1" max="8" style="width:3rem"></label>
  <label>fps <input id="fps" type="number" value="12" min="1" max="30" style="width:3.5rem"></label>
  <button id="go">Start</button>
  <button id="dump">Copy results</button>
</header>

<main id="send">
  <canvas id="tx" width="1600" height="1000"></canvas>
  <table id="txstats"></table>
</main>

<main id="recv">
  <video id="cam" playsinline muted autoplay></video>
  <div class="big" id="headline">—</div>
  <table id="rxstats"></table>
</main>

<script type="module">
import { Sender, Receiver, RUNGS } from './rig.js';

const L = 256;                     // plan.md D19
const $ = (id) => document.getElementById(id);
let role = null, sender = null, receiver = null, timer = null;

const setRole = (r) => {
  role = r;
  $('bSend').ariaPressed = String(r === 'send');
  $('bRecv').ariaPressed = String(r === 'recv');
  $('send').className = r === 'send' ? 'on' : '';
  $('recv').className = r === 'recv' ? 'on' : '';
};
$('bSend').onclick = () => setRole('send');
$('bRecv').onclick = () => setRole('recv');

const cfg = () => ({
  rung: $('rung').value,
  L,
  modulePx: +$('mod').value,
  cols: +$('cols').value,
  rows: +$('rows').value,
  fps: +$('fps').value,
});

const row = (k, v, cls = '') => `<tr><td>${k}</td><td class="${cls}">${v}</td></tr>`;
const n = (x, d = 1) => (x ?? 0).toFixed(d);

$('go').onclick = async () => {
  const c = cfg();
  if (role === 'send') {
    const r = RUNGS[c.rung];
    // size the canvas so tiles land at an exact integer module size — no resampling
    const modules = 17 + 4 * r.ver;
    const tile = modules * c.modulePx, pad = 8;
    $('tx').width = pad + c.cols * (tile + pad);
    $('tx').height = pad + c.rows * (tile + pad);
    sender = new Sender($('tx'));
    await sender.start(c);
    timer = setInterval(() => {
      const s = sender.stats();
      $('txstats').innerHTML =
        row('rung', `${c.rung} v${r.ver} · ${r.packets} pkt/tile`) +
        row('tiles/frame', c.cols * c.rows) +
        row('packets/frame', c.cols * c.rows * r.packets) +
        row('requested fps', c.fps) +
        row('actual fps', n(s.actualFps, 2), s.actualFps < c.fps * 0.9 ? 'warn' : 'ok') +
        row('wire rate', `${n(s.wireBytesPerSec / 1024)} KB/s`) +
        row('packets emitted', s.packetsEmitted.toLocaleString());
    }, 500);
  } else {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
    $('cam').srcObject = stream;
    await $('cam').play();
    const expect = c.cols * c.rows * RUNGS[c.rung].packets;
    receiver = new Receiver($('cam'));
    await receiver.start({ L, expectPerFrame: expect });
    timer = setInterval(() => {
      const s = receiver.stats();
      $('headline').textContent = `${n(s.goodputBytesPerSec / 1024)} KB/s goodput`;
      $('headline').className = 'big ' + (s.goodputBytesPerSec / 1024 >= 20 ? 'ok' : s.goodputBytesPerSec / 1024 >= 10 ? 'warn' : 'bad');
      $('rxstats').innerHTML =
        row('camera fps', n(s.cameraFps, 1), s.cameraFps < 20 ? 'warn' : 'ok') +
        row('exposureCompensation applied', s.exposureApplied, s.exposureApplied ? 'ok' : 'warn') +
        row('unique packets', s.uniquePackets.toLocaleString()) +
        row('tile yield', `${n(s.tileYield * 100)}%`) +
        row('<b>erasure rate</b>', `<b>${n(s.erasureRate * 100)}%</b>`,
            s.erasureRate > 0.30 ? 'bad' : s.erasureRate > 0.20 ? 'warn' : 'ok') +
        row('frames yielding zero', `${n(s.framesWithZero * 100)}%`) +
        row('decode p50 / p99', `${n(s.decodeMsP50)} / ${n(s.decodeMsP99)} ms`,
            s.decodeMsP99 > 60 ? 'bad' : 'ok') +
        row('corrupt tiles', s.corruptTiles) +
        row('<b>byte mismatches</b>', `<b>${s.byteMismatches}</b>`, s.byteMismatches ? 'bad' : 'ok');
    }, 500);
  }
  $('go').textContent = 'Stop';
  $('go').onclick = () => location.reload();
};

$('dump').onclick = async () => {
  const src = role === 'send' ? sender : receiver;
  if (!src) return;
  const out = { role, config: cfg(), stats: src.stats(), ua: navigator.userAgent, at: new Date().toISOString() };
  await navigator.clipboard.writeText(JSON.stringify(out, null, 2));
  $('dump').textContent = 'Copied ✓';
};

// ── URL-driven mode, so tools/devrig.sh can start both ends with no taps ──
// ?role=send|recv &rung=R2 &mod=4 &cols=4 &rows=3 &fps=12 &auto=1
const q = new URLSearchParams(location.search);
if (q.has('rung')) $('rung').value = q.get('rung');
for (const [k, id] of [['mod','mod'],['cols','cols'],['rows','rows'],['fps','fps']]) {
  if (q.has(k)) $(id).value = q.get(k);
}
setRole(q.get('role') === 'recv' ? 'recv' : 'send');

// Expose live stats so the harness can scrape without OCR-ing a screenshot.
Object.defineProperty(window, 'sfStats', {
  get: () => {
    const src = role === 'send' ? sender : receiver;
    return src ? { role, config: cfg(), stats: src.stats() } : { role, stats: null };
  },
});

if (q.get('auto') === '1') {
  // A user gesture is not required for getUserMedia when the permission is already
  // granted, which it is after the first manual grant on this origin.
  addEventListener('load', () => setTimeout(() => $('go').click(), 400));
}
</script>
